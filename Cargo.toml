[package]
name = "meeting-recorder-windows"
version = "0.1.7"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
async-channel = "2.5.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
serde_json = "1.0.151"
ort = "2.0.0-rc.13"
realfft = "3"
ureq = "3.4.2"
whisper-rs = "0.16"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
wasapi = "0.24"
rodio = "0.19"
dirs = "6"
interprocess = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[features]
default = []
# GPU transcription through whisper.cpp's Vulkan backend. Needs the Vulkan
# headers (`vulkan-headers` on Arch) and glslc (`shaderc`) to build.
vulkan = ["whisper-rs/vulkan"]

[[bin]]
name = "meeting-recorder-windows"
path = "src/main.rs"

[patch.crates-io]
# whisper-rs-sys 0.15.0 vendored sous third-party/ (+3 patchs GNU/MinGW, voir son historique) : pas de dépendance réseau.
whisper-rs-sys = { path = "third-party/whisper-rs-sys" }
