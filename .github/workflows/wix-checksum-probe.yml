# Temporary, read-only SHA calculation from the repository-pinned WiX release archive.
name: wix-checksum-probe
on:
  push:
    branches: [chatgpt/fix-wix-preinstalled-hashes-20261018]
permissions:
  contents: read
jobs:
  hashes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Syntaxe PowerShell et tests WiX hors réseau
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD '.github/scripts/setup-wix.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          ./.github/scripts/test-wix-preinstalled.ps1
      - name: Extract trusted WiX binary SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 --silent --show-error \
            https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip \
            --output /tmp/wix314-binaries.zip
          test "$(stat -c %s /tmp/wix314-binaries.zip)" = 41297555
          echo "6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31  /tmp/wix314-binaries.zip" | sha256sum --check --strict
          python3 - <<'PY'
          import hashlib
          from zipfile import ZipFile
          with ZipFile('/tmp/wix314-binaries.zip') as archive:
              for name in ('candle.exe', 'light.exe', 'heat.exe'):
                  data = archive.read(name)
                  print(f'PIN {name} {len(data)} {hashlib.sha256(data).hexdigest()}', flush=True)
          PY
