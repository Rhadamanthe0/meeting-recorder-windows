name: windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + MSVC target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install GTK4 (MSYS2 UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc

      - name: Install ffmpeg
        run: winget install --exact --silent --accept-source-agreements --accept-package-agreements Gyan.FFmpeg

      - name: Expose GTK to MSVC build
        run: |
          "C:\msys64\ucrt64\bin" >> $env:GITHUB_PATH
          "PKG_CONFIG_PATH=C:\msys64\ucrt64\lib\pkgconfig" >> $env:GITHUB_ENV

      - name: Generate lockfile if missing
        run: |
          if (-not (Test-Path -LiteralPath "Cargo.lock")) { cargo generate-lockfile }

      - name: Check
        run: cargo check

      - name: Test
        run: cargo test

      - name: Build release (Vulkan OFF by default)
        run: cargo build --release
