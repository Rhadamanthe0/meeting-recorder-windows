name: windows

# Build Windows : toolchain GNU alignée sur les libs GTK MinGW (UCRT64).
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    env:
      # Binaire portable, pas de -march=native du runner (crash AVX512 sur CPU cibles).
      GGML_NATIVE: "OFF"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # Stratégie GTK : hôte GNU x86_64-pc-windows-gnu, compatible avec les
      # libs GTK4/libadwaita MinGW (UCRT64) + gcc natif via pkg-config.
      # Alternative MSVC (non retenue : risque d'échec de link gtk4-rs/
      # libadwaita MinGW depuis MSVC) :
      #   toolchain: stable / targets: x86_64-pc-windows-msvc
      - name: Install Rust stable GNU
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
          # Éteint le warning rustfmt non fatal vu en log CI.
          # clippy : requis par le step informatif "Clippy" ci-dessous.
          components: rustfmt, clippy

      - name: Affiche la toolchain (hôte GNU attendu)
        run: rustc -vV

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install GTK4 (MSYS2 UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang

      # ffmpeg bloquant : requis par export_audio, le step échoue si introuvable.
      - name: Install ffmpeg
        run: |
          winget install --exact --accept-source-agreements --accept-package-agreements Gyan.FFmpeg
          $ff = $null
          try { $ff = (Get-Command ffmpeg.exe -ErrorAction Stop).Source } catch {}
          if (-not $ff) {
            $pkg = Join-Path $env:LOCALAPPDATA "Microsoft\WinGet\Packages"
            if (Test-Path $pkg) { $ff = Get-ChildItem -Path $pkg -Filter "ffmpeg.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 | ForEach-Object { $_.FullName } }
          }
          if (-not $ff -or -not (Test-Path $ff)) { throw "ffmpeg.exe introuvable après winget install Gyan.FFmpeg" }
          Split-Path $ff -Parent >> $env:GITHUB_PATH
          & $ff -version | Select-Object -First 2
          Write-Output "[ci] ffmpeg=$ff"

      # Expose pkg-config + gcc UCRT64 au build cargo (hôte GNU par défaut).
      - name: Expose GTK au build GNU
        run: |
          # Diagnostic discriminant : affiche les faits (emplacement MSYS2 reel) au lieu de deviner.
          Write-Output "[ci] RUNNER_TEMP=$env:RUNNER_TEMP"
          Get-ChildItem $env:RUNNER_TEMP -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "[ci] tempdir: $($_.FullName)" }
          $roots = @((Join-Path $env:RUNNER_TEMP "setup-msys2"), "D:\msys64", "C:\msys64")
          $p = $null
          try { $p = (Get-Command pkgconf.exe -ErrorAction Stop).Source } catch {}
          foreach ($r in $roots) {
            Write-Output "[ci] test racine : $r -> $(Test-Path $r)"
            foreach ($sub in @("ucrt64\bin\pkgconf.exe", "msys64\ucrt64\bin\pkgconf.exe", "usr\bin\pkgconf.exe")) {
              $cand = if ($r) { Join-Path $r $sub } else { $null }
              if (-not $p -and $cand -and (Test-Path $cand)) { $p = $cand }
            }
            if (Test-Path $r) { Get-ChildItem $r -Directory -ErrorAction SilentlyContinue | Select-Object -First 12 | ForEach-Object { Write-Output "[ci] subdir de $r : $($_.Name)" } }
          }
          if (-not $p) {
            Write-Output "[ci] recherche pkgconf.exe sous RUNNER_TEMP (peut prendre 1-2 min)"
            Get-ChildItem -Path $env:RUNNER_TEMP -Filter "pkgconf.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 5 | ForEach-Object { Write-Output "[ci] trouve : $($_.FullName)"; if (-not $p) { $p = $_.FullName } }
          }
          if (-not $p) { throw "pkgconf.exe introuvable meme apres diagnostic (voir [ci] ci-dessus)" }
          $bindir = Split-Path $p -Parent
          $ucrt = Split-Path $bindir -Parent
          $bindir >> $env:GITHUB_PATH
          "PKG_CONFIG=$p" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$ucrt\lib\pkgconfig;$ucrt\share\pkgconfig" >> $env:GITHUB_ENV
          # bindgen (whisper-rs) exige libclang.dll via LIBCLANG_PATH (ucrt64/bin).
          "LIBCLANG_PATH=$bindir" >> $env:GITHUB_ENV
          "UCRT_BIN=$bindir" >> $env:GITHUB_ENV
          try { Copy-Item -LiteralPath $p -Destination (Join-Path $bindir "pkg-config.exe") } catch { Write-Warning "[ci] copie pkg-config.exe impossible, on continue : $($_.Exception.Message)" }
          Write-Output "[ci] pkgconf=$p"

      # ORT dynamique : binaires Microsoft 1.28 pour ort-sys GNU (sans précompilés GNU).
      - name: ORT dynamique Microsoft 1.28
        run: |
          $ortZip = Join-Path $env:RUNNER_TEMP "ort.zip"
          $ortDir = Join-Path $env:RUNNER_TEMP "ort"
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/onnxruntime-win-x64-1.28.0.zip" -OutFile $ortZip
          Expand-Archive -LiteralPath $ortZip -DestinationPath $ortDir -Force
          $ortRoot = Join-Path $ortDir "onnxruntime-win-x64-1.28.0"
          $ortLib = Join-Path $ortRoot "lib"
          if (-not (Test-Path $ortLib)) { $ortLib = $ortRoot }
          "ORT_LIB_LOCATION=$ortLib" >> $env:GITHUB_ENV
          "ORT_PREFER_DYNAMIC_LINK=1" >> $env:GITHUB_ENV
          $ortLib >> $env:GITHUB_PATH
          Write-Output "[ci] ORT_LIB_LOCATION=$ortLib"
          Get-ChildItem $ortLib | ForEach-Object { Write-Output "[ci] ort: $($_.Name)" }

      # Régénère le lock en CI : le Cargo.lock amont (Linux) ne contient pas
      # les deps Windows, cargo doit pouvoir le mettre à jour (accès réseau).
      - name: Generate lockfile
        run: cargo generate-lockfile

      # Guard A (bloquant) : tout spawn Windows doit passer par
      # `platform::silent_command` (CREATE_NO_WINDOW), sinon flash de console.
      # Seule source légitime de `Command::new` = src/platform.rs.
      # Faux positifs connus et tolérés : spawns Unix-only sous gate cfg
      # (`cfg(target_os = "linux")` ou `cfg(not(target_os = "windows"))` dans
      # les 40 lignes au-dessus ou en tête de fichier : agent.rs
      # omarchy-default-agent/opencode/setsid/kill, parec, hyprctl,
      # ffmpeg|pacat/ffprobe sous `#[cfg(target_os = "linux")]`).
      # Si un hit Windows-légitime apparaît hors platform.rs : NE PAS ajouter
      # d'exception silencieuse, le migrer vers `silent_command` (c'est le but).
      - name: Guard spawns console (silent_command obligatoire)
        run: |
          $hits = @(Get-ChildItem -LiteralPath src -Recurse -Filter *.rs | Select-String -Pattern 'Command::new' | ForEach-Object { "$(([System.IO.Path]::GetRelativePath((Get-Location).Path, $_.Path) -replace '\\','/')):$($_.LineNumber):$($_.Line.Trim())" })
          $bad = @()
          foreach ($h in $hits) {
            if ($h -match '^src/platform\.rs:') { continue }
            if ($h -match '^(.*?):(\d+):') {
              $file = $Matches[1]
              $line = [int]$Matches[2]
              $all = Get-Content -LiteralPath $file
              $from = [Math]::Max(0, $line - 41)
              $ctx = @($all | Select-Object -First 3) + @($all | Select-Object -Skip $from -First 40)
              $gated = @($ctx | Where-Object { $_ -match 'cfg\s*\(\s*(not\s*\(\s*target_os\s*=\s*"windows"\s*\)|target_os\s*=\s*"linux")' }).Count -gt 0
              if ($gated) { Write-Output "[ci] hit Unix-only toléré : $h" }
              else { $bad += $h }
            } else { $bad += $h }
          }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Output "[ci] spawn brut : $_" }
            throw "Command::new hors src/platform.rs sans gate cfg Unix ($($bad.Count) hit(s)) : utiliser platform::silent_command (CREATE_NO_WINDOW) au lieu de spawner brut"
          }
          Write-Output "[ci] guard Command::new OK"

      # Guard C (bloquant) : `gio::launch_default_for_uri` échoue
      # silencieusement sur Windows ; tout le code doit passer par
      # `platform::open_uri` (ShellExecuteW). Seule occurrence
      # légitime = la branche Unix de `open_uri` dans src/platform.rs.
      - name: Guard open_uri (pas de launch_default_for_uri direct)
        run: |
          $hits = @(Get-ChildItem -LiteralPath src -Recurse -Filter *.rs | Select-String -Pattern 'launch_default_for_uri' | ForEach-Object { "$(([System.IO.Path]::GetRelativePath((Get-Location).Path, $_.Path) -replace '\\','/')):$($_.LineNumber):$($_.Line.Trim())" })
          $bad = @($hits | Where-Object { $_ -notmatch '^src/platform\.rs:' })
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Output "[ci] appel direct : $_" }
            throw "launch_default_for_uri hors src/platform.rs ($($bad.Count) hit(s)) : utiliser platform::open_uri"
          }
          Write-Output "[ci] guard launch_default_for_uri OK"

      # Rustfmt bloquant (~10 s) : attrape le code non formaté avant review.
      - name: Format rustfmt (bloquant)
        run: cargo fmt --all -- --check

      # Contrôle sur le lock régénéré ci-dessus.
      - name: Check
        run: cargo check

      - name: Test
        run: cargo test

      # Clippy informatif (NON BLOQUANT, continue-on-error) : relève les
      # warnings sans gater tant que le socle n'est pas clean ; gating futur
      # envisagé une fois le bruit résorbé.
      - name: Clippy (informatif, non bloquant)
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      # Diagnostic ggml manquant : affiche les OUT_DIR et libs statiques réellement produits.
      - name: Diagnostic libs statiques
        if: always()
        run: |
          Write-Output "[ci] OUT_DIR whisper-rs-sys :"
          Get-ChildItem -Path "target/debug/build" -Directory -Filter "whisper-rs-sys-*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Output ("[ci] out: " + $_.FullName) }
          Write-Output "[ci] libs statiques sous target/ :"
          Get-ChildItem -Path "target" -Include *.a,*.lib -Recurse -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { Write-Output ("[ci] lib: " + $_.FullName + " (" + $_.Length + " o)") }

      - name: Build release (Vulkan OFF by default)
        run: cargo build --release

      # Guard subsystem GUI (bloquant) : l'exe doit être `Windows GUI` sinon
      # Windows ouvre une console au double-clic. Double preuve : header PE
      # (`objdump -p` exige `Subsystem ... Windows GUI`, lecture seule) +
      # l'attribut source `windows_subsystem = "windows"` dans src/main.rs.
      - name: Guard subsystem GUI (pas de console au double-clic)
        run: |
          if (-not (Select-String -Path src/main.rs -Pattern 'windows_subsystem = "windows"' -Quiet)) { throw 'attribut windows_subsystem manquant dans src/main.rs (console au double-clic)' }
          $objdump = Join-Path $env:UCRT_BIN "objdump.exe"
          if (-not (Test-Path -LiteralPath $objdump)) { throw "objdump.exe introuvable ($objdump) : impossible de vérifier le subsystem PE" }
          $hdr = & $objdump -p target/release/meeting-recorder-windows.exe
          if ($LASTEXITCODE -ne 0) { throw "objdump -p exit $LASTEXITCODE" }
          $hdr | ForEach-Object { Write-Output "[ci] objdump: $_" }
          if (-not ($hdr | Where-Object { $_ -match 'Subsystem\s+.*Windows GUI' })) { throw "subsystem PE inattendu (pas Windows GUI) : l'exe ouvrirait une console au double-clic" }
          Write-Output "[ci] guard subsystem GUI OK"

      # Remplace les symlinks copy-dylibs par de vrais fichiers DLL (symlink-safe).
      - name: Copie DLL ORT vers target/release
        run: |
          Get-ChildItem (Join-Path $env:ORT_LIB_LOCATION "*.dll") | ForEach-Object {
            $dest = Join-Path "target/release/" $_.Name
            if (Test-Path $dest) { Remove-Item $dest -Force }
            Copy-Item $_.FullName $dest -Force
          }
          Write-Output "[ci] DLL ORT copiées vers target/release"

      # Lock régénéré à récupérer pour le committer ensuite.
      - name: Upload Cargo.lock régénéré
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          if-no-files-found: warn
          path: Cargo.lock

      # WiX v3 (candle/light/heat) pour le MSI per-user. Idempotent : choco
      # seulement si candle est absent.
      - name: Install WiX v3 (MSI)
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          }
          $wixBin = $null
          foreach ($dir in @("C:\Program Files (x86)\WiX Toolset v3.14\bin", "C:\Program Files (x86)\WiX Toolset v3.11\bin")) {
            if (Test-Path -LiteralPath $dir) { $wixBin = $dir; break }
          }
          if (-not $wixBin) { throw "candle.exe introuvable après choco install wixtoolset" }
          $wixBin >> $env:GITHUB_PATH
          $env:PATH = "$wixBin;$env:PATH"
          candle.exe -? | Select-Object -First 2

      # MSI per-user : stage runtime (collect-runtime.ps1, qui couvre aussi les
      # DLLs MinGW via target/release puis UCRT_BIN) puis heat/candle/light.
      # Version = tag sans le v initial, sinon 0.1.0 (sur master : pas de tag).
      - name: Build MSI
        run: |
          $version = "0.1.0"
          $ref = $env:GITHUB_REF_NAME
          if ($ref -match '^v?(\d+(?:\.\d+)*)$') {
            $parts = @($Matches[1] -split '\.')
            while ($parts.Count -lt 3) { $parts += "0" }
            $version = ($parts[0..2] -join ".")
          }
          Write-Output "[ci] msi version=$version (ref=$ref)"
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/collect-runtime.ps1
          if ($LASTEXITCODE -ne 0) { throw "collect-runtime.ps1 exit $LASTEXITCODE (stage partiel refusé)" }
          Set-Location packaging/windows
          heat dir stage -cg HarvestedFiles -gg -scom -sreg -sfrag -srd -dr INSTALLFOLDER -var var.StageDir -t harvest.xsl -out stage-files.wxs
          candle "-dStageDir=stage" "-dVersion=$version" Product.wxs stage-files.wxs
          light -ext WixUIExtension -sice:ICE38 -sice:ICE43 -sice:ICE64 -o "MeetingRecorder-$version.msi" Product.wixobj stage-files.wixobj
          Get-ChildItem *.msi | ForEach-Object { Write-Output ("[ci] msi: " + $_.FullName + " (" + $_.Length + " o)") }

      # Preuve d'installation : MSI per-user silencieux puis lancement de
      # l'exe installé avec --help SANS ucrt64/bin au PATH (la closure
      # embarquée doit suffire). --help quitte avant toute init GTK.
      - name: Test MSI per-user (msiexec + exe --help sans UCRT au PATH)
        run: |
          $msi = Get-ChildItem packaging/windows/*.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI introuvable sous packaging/windows/" }
          $log = Join-Path $env:RUNNER_TEMP "msi-install.log"
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart /L*v `"$log`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Get-Content $log -Tail 40 -ErrorAction SilentlyContinue
            throw "msiexec /i exit $($install.ExitCode)"
          }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\MeetingRecorder\meeting-recorder-windows.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "exe installé introuvable : $exe" }
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and $_ -notmatch 'msys|ucrt64|mingw|UCRT_BIN' }) -join ';'
          # Diagnostic imports manquants (lecture seule, BLOQUANT via throw
          # après le bloc try : une closure incomplète ne doit plus passer).
          $diagMissing = @()
          try {
            $diagObjdump = Join-Path $env:UCRT_BIN "objdump.exe"
            if (-not (Test-Path -LiteralPath $diagObjdump)) {
              Write-Warning "[diag] objdump introuvable ($diagObjdump), diagnostic ignoré"
            } else {
              $diagDir = Split-Path $exe -Parent
              $diagSys32 = Join-Path $env:SystemRoot "System32"
              $diagSys = New-Object System.Collections.Generic.HashSet[string]([System.StringComparer]::OrdinalIgnoreCase)
              @(
                "advapi32.dll", "avrt.dll", "bcrypt.dll", "cfgmgr32.dll", "comctl32.dll",
                "comdlg32.dll", "crypt32.dll", "cryptbase.dll", "d2d1.dll", "d3d11.dll",
                "dcomp.dll", "dhcpcsvc.dll", "dnsapi.dll", "dwmapi.dll", "dxgi.dll",
                "fwpuclnt.dll", "gdi32.dll", "gdiplus.dll", "hid.dll", "imm32.dll",
                "iphlpapi.dll", "kernel32.dll", "kernelbase.dll", "ksuser.dll",
                "mmdevapi.dll", "msimg32.dll", "msvcrt.dll", "mswsock.dll", "netapi32.dll",
                "nsi.dll", "ntdll.dll", "ole32.dll", "oleaut32.dll", "opengl32.dll",
                "powrprof.dll", "propsys.dll", "psapi.dll", "rpcrt4.dll", "sechost.dll",
                "setupapi.dll", "shcore.dll", "shell32.dll", "shlwapi.dll", "ucrtbase.dll",
                "user32.dll", "userenv.dll", "usp10.dll", "uxtheme.dll", "version.dll",
                "winmm.dll", "winspool.drv", "ws2_32.dll", "wtsapi32.dll", "dwrite.dll",
                "windowscodecs.dll", "winhttp.dll", "wininet.dll", "urlmon.dll",
                "dbghelp.dll", "ncrypt.dll", "profapi.dll", "secur32.dll",
                "d3d12.dll", "wldap32.dll", "bcryptprimitives.dll"
              ) | ForEach-Object { [void]$diagSys.Add($_) }
              $diagPresent = New-Object System.Collections.Generic.HashSet[string]([System.StringComparer]::OrdinalIgnoreCase)
              Get-ChildItem -LiteralPath $diagDir -Include "*.exe", "*.dll" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { [void]$diagPresent.Add($_.Name) }
              $diagSeen = @{}
              $diagQueue = New-Object System.Collections.Generic.Queue[string]
              $diagQueue.Enqueue($exe)
              $diagSeen[$exe.ToLowerInvariant()] = $true
              while ($diagQueue.Count -gt 0) {
                $diagFile = $diagQueue.Dequeue()
                $diagOut = & $diagObjdump -p $diagFile 2>$null
                foreach ($diagLine in $diagOut) {
                  if ($diagLine -match "DLL Name:\s*(\S+)") {
                    $diagDep = $Matches[1]
                    $diagLower = $diagDep.ToLowerInvariant()
                    if ($diagSys.Contains($diagDep) -or $diagLower.StartsWith("api-ms-") -or $diagLower.StartsWith("ext-ms-")) { continue }
                    if ($diagPresent.Contains($diagDep)) {
                      $diagFull = Get-ChildItem -Path $diagDir -Filter $diagDep -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
                      if ($diagFull -and -not $diagSeen.ContainsKey($diagFull.FullName.ToLowerInvariant())) {
                        $diagSeen[$diagFull.FullName.ToLowerInvariant()] = $true
                        $diagQueue.Enqueue($diagFull.FullName)
                      }
                      continue
                    }
                    if (Test-Path -LiteralPath (Join-Path $diagSys32 $diagDep)) { continue }
                    $diagMissing += "$diagDep (importé par $(Split-Path $diagFile -Leaf))"
                  }
                }
              }
            }
          } catch {
            Write-Warning "[diag] diagnostic imports impossible : $($_.Exception.Message)"
          }
          if ($diagMissing.Count -gt 0) {
            $diagMissing | ForEach-Object { Write-Output "[diag] import manquant : $_" }
            throw "imports DLL manquants ($($diagMissing.Count)) : closure embarquée incomplète"
          }
          # Exe GUI (windows_subsystem) : PowerShell n'attend pas et ne capte
          # rien avec `& $exe --help`, d'où Start-Process + pipe fichier.
          $helpProc = Start-Process $exe -ArgumentList "--help" -Wait -NoNewWindow -RedirectStandardOutput out.txt -PassThru
          if ($helpProc.ExitCode -ne 0) { throw "exe --help exit $($helpProc.ExitCode) (closure DLL incomplète ?)" }
          if (-not (Select-String -Path out.txt -Pattern "Usage" -Quiet)) { Get-Content out.txt -ErrorAction SilentlyContinue; throw "exe --help sans 'Usage' dans out.txt (console GUI non rattachée ?)" }
          Write-Output "[ci] MSI per-user OK, exe --help OK sans UCRT au PATH"
          # ffmpeg embarqué (requis par export_audio) : doit démarrer et
          # afficher sa version, sinon le MSI est incomplet.
          $ffExe = Join-Path (Split-Path $exe -Parent) "ffmpeg.exe"
          if (-not (Test-Path -LiteralPath $ffExe)) { throw "ffmpeg.exe embarqué introuvable à côté de l'exe installé : $ffExe" }
          $ffOut = & $ffExe -version 2>&1 | Select-Object -First 3
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg.exe embarqué -version exit $LASTEXITCODE" }
          if (-not $ffOut) { throw "ffmpeg.exe embarqué -version sans sortie (binaire corrompu ?)" }
          $ffOut | ForEach-Object { Write-Output "[ci] bundled ffmpeg: $_" }
          $uninstall = Start-Process msiexec.exe -ArgumentList "/x `"$($msi.FullName)`" /qn /norestart" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "msiexec /x exit $($uninstall.ExitCode)" }

      # Smoke GUI démarrage (NON BLOQUANT, continue-on-error) : détecte un
      # crash immédiat au lancement de l'exe. Limite assumée : le runner CI
      # n'a pas de display garanti et aucun headless GTK (broadway/xvfb)
      # n'existe sur UCRT64, donc ce step reste informatif et ne gate jamais.
      - name: Smoke GUI démarrage (informatif, non bloquant)
        continue-on-error: true
        run: |
          $exe = "target/release/meeting-recorder-windows.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "exe introuvable : $exe" }
          $env:GDK_BACKEND = "win32"
          $p = Start-Process $exe -NoNewWindow -PassThru
          try {
            if ($p.WaitForExit(15000)) {
              if ($p.ExitCode -ne 0) { throw "l'exe a quitté en 15 s avec le code $($p.ExitCode) (crash au démarrage ?)" }
              Write-Output "[ci] GUI smoke : sortie immédiate code 0"
            } else {
              Write-Output "[ci] GUI smoke : toujours vivant après 15 s (pas de crash au démarrage)"
            }
          } finally {
            try { if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } } catch {}
          }

      - name: Upload msi-stage (diagnostic closure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msi-stage
          if-no-files-found: warn
          path: packaging/windows/stage/

      - name: Upload MSI Windows x86_64
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          if-no-files-found: error
          path: packaging/windows/*.msi
