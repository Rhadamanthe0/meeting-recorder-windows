name: release

# Release Windows déclenchée par tag v* (ex. v0.1.0), ou par dispatch manuel
# `gh workflow run release.yml -f tag=vX.Y.Z` (contourne l'anti-boucle : un
# push de tag effectué avec le GITHUB_TOKEN ne déclenche aucun workflow).
# Build identique à windows.yml (toolchain GNU + MSYS2 UCRT64), puis
# publication GitHub.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag v existant à publier (ex v0.1.10) ; absent = échec, jamais master"
        required: true
        default: ""
        type: string

permissions:
  contents: read

# Un dispatch annule le run precedent du meme tag (build + MSI couteux).
concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    # Tags + dispatch manuel : jamais de code de fork → PCs du propriétaire.
    runs-on: [self-hosted, windows, x64, meeting-recorder]
    permissions:
      contents: read
    env:
      # Binaire portable, pas de -march=native du runner (crash AVX512 sur CPU cibles).
      GGML_NATIVE: "OFF"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Dispatch manuel : le tag doit exister sur origin, sinon échec.
      # Publier un MSI `X.Y.Z` depuis master quand `vX.Y.Z` n'existe pas est
      # interdit : la chaîne est tag existant -> checkout exact -> version
      # Cargo == version tag -> build MSI -> smoke test de CE MSI ->
      # publication du même artefact.
      - name: Aligne sur le tag dispatché (existant, sinon échec)
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git fetch origin --tags --force
          git rev-parse --verify "refs/tags/$env:TAG" 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw "tag $env:TAG absent d'origin : dispatch refusé (jamais de build depuis master pour une release X.Y.Z)"
          }
          git checkout "refs/tags/$env:TAG"
          Write-Output "[ci] checkout tag $env:TAG"

      # Garde-fou fail-closed : pas de tag demandé et pas de push de tag =
      # rien à publier (ex. dispatch sans input).
      - name: Refuse un build release sans tag
        if: inputs.tag == '' && github.ref_type != 'tag'
        run: |
          throw "aucun tag (ni dispatch ni push de tag) : release refusée"

      # La version Cargo doit être exactement celle du tag : un MSI 0.1.10
      # ne doit jamais sortir d'un code 0.1.11.
      - name: Version Cargo == version tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ref = $env:INPUT_TAG
          if (-not $ref) { $ref = $env:GITHUB_REF_NAME }
          if ($ref -notmatch '^v?(\d+(?:\.\d+)*)$') { throw "ref $ref n'est pas un tag version" }
          $want = $Matches[1]
          $cargo = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -First 1
          if (-not $cargo) { throw "version introuvable dans Cargo.toml" }
          if ($cargo -ne $want) { throw "Cargo.toml ($cargo) != tag ($want) : release refusée" }
          Write-Output "[ci] version OK : $cargo"

      # Même stratégie GTK que windows.yml : hôte GNU aligné sur MinGW UCRT64.
      - name: Install Rust stable GNU
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
          # Éteint le warning rustfmt non fatal vu en log CI.
          components: rustfmt

      - name: Affiche la toolchain (hôte GNU attendu)
        run: rustc -vV

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install GTK4 (MSYS2 UCRT64)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-cmake

      # Pas de ffmpeg live au PATH en release : le collector télécharge toujours
      # le ZIP pinné vérifié (GyanD/codexffmpeg 9.0.2, SHA-256 + taille contrôlés,
      # MR_FFMPEG_PINNED_ONLY=1 sur le step Build MSI). Le PATH ne doit plus
      # fournir ffmpeg au build release (ancien step live supprimé : paquet
      # mutable non versionné, exécuté via -version).

      - name: Expose GTK au build GNU
        run: |
          # Diagnostic discriminant : affiche les faits (emplacement MSYS2 reel) au lieu de deviner.
          Write-Output "[ci] RUNNER_TEMP=$env:RUNNER_TEMP"
          Get-ChildItem $env:RUNNER_TEMP -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "[ci] tempdir: $($_.FullName)" }
          $roots = @((Join-Path $env:RUNNER_TEMP "setup-msys2"), "D:\msys64", "C:\msys64")
          $p = $null
          try { $p = (Get-Command pkgconf.exe -ErrorAction Stop).Source } catch {}
          foreach ($r in $roots) {
            Write-Output "[ci] test racine : $r -> $(Test-Path $r)"
            foreach ($sub in @("ucrt64\bin\pkgconf.exe", "msys64\ucrt64\bin\pkgconf.exe", "usr\bin\pkgconf.exe")) {
              $cand = $null; try { if ($r) { $cand = Join-Path $r $sub } } catch { $cand = $null }
              if (-not $p -and $cand -and (Test-Path $cand)) { $p = $cand }
            }
            if (Test-Path $r) { Get-ChildItem $r -Directory -ErrorAction SilentlyContinue | Select-Object -First 12 | ForEach-Object { Write-Output "[ci] subdir de $r : $($_.Name)" } }
          }
          if (-not $p) {
            Write-Output "[ci] recherche pkgconf.exe sous RUNNER_TEMP (peut prendre 1-2 min)"
            Get-ChildItem -Path $env:RUNNER_TEMP -Filter "pkgconf.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 5 | ForEach-Object { Write-Output "[ci] trouve : $($_.FullName)"; if (-not $p) { $p = $_.FullName } }
          }
          if (-not $p) { throw "pkgconf.exe introuvable meme apres diagnostic (voir [ci] ci-dessus)" }
          $bindir = Split-Path $p -Parent
          $ucrt = Split-Path $bindir -Parent
          $bindir >> $env:GITHUB_PATH
          "PKG_CONFIG=$p" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$ucrt\lib\pkgconfig;$ucrt\share\pkgconfig" >> $env:GITHUB_ENV
          # bindgen (whisper-rs) exige libclang.dll via LIBCLANG_PATH (ucrt64/bin).
          "LIBCLANG_PATH=$bindir" >> $env:GITHUB_ENV
          "UCRT_BIN=$bindir" >> $env:GITHUB_ENV
          try { Copy-Item -LiteralPath $p -Destination (Join-Path $bindir "pkg-config.exe") } catch { Write-Warning "[ci] copie pkg-config.exe impossible, on continue : $($_.Exception.Message)" }
          Write-Output "[ci] pkgconf=$p"

      # ORT dynamique : binaires Microsoft 1.28 pour ort-sys GNU (sans précompilés GNU).
      # Hash source : api.github.com repos/microsoft/onnxruntime releases/tags/v1.28.0,
      # champ digest de l'asset onnxruntime-win-x64-1.28.0.zip (size 78796801).
      - name: ORT dynamique Microsoft 1.28
        run: |
          $ortZip = Join-Path $env:RUNNER_TEMP "ort.zip"
          $ortDir = Join-Path $env:RUNNER_TEMP "ort"
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/onnxruntime-win-x64-1.28.0.zip" -OutFile $ortZip
          $expected = "abef733dacbe2f571547a7150b479b5cb9cc0df22f96c24983a42cadb1b4f8bc"
          $actual = (Get-FileHash -LiteralPath $ortZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA-256 ORT inattendu : $actual (attendu $expected)" }
          Expand-Archive -LiteralPath $ortZip -DestinationPath $ortDir -Force
          $ortRoot = Join-Path $ortDir "onnxruntime-win-x64-1.28.0"
          $ortLib = Join-Path $ortRoot "lib"
          if (-not (Test-Path $ortLib)) { $ortLib = $ortRoot }
          "ORT_LIB_LOCATION=$ortLib" >> $env:GITHUB_ENV
          "ORT_PREFER_DYNAMIC_LINK=1" >> $env:GITHUB_ENV
          $ortLib >> $env:GITHUB_PATH
          Write-Output "[ci] ORT_LIB_LOCATION=$ortLib"
          Get-ChildItem $ortLib | ForEach-Object { Write-Output "[ci] ort: $($_.Name)" }

      # Tests (export.rs) : ffmpeg réel exigé (spawn via `.unwrap()`), fourni
      # sans winget : ZIP GyanD/codexffmpeg 9.0.2 pinné vérifié (taille +
      # SHA-256 AVANT Expand-Archive). Seul le dossier `bin` rejoint le PATH.
      # Hash source : api.github.com GyanD/codexffmpeg releases/tags/9.0.2,
      # digest officiel de l'asset ffmpeg-9.0.2-essentials_build.zip.
      - name: Provide ffmpeg for tests (pinned, verified)
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg-tests.zip"
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip" -OutFile $zip
          $size = (Get-Item -LiteralPath $zip).Length
          if ($size -ne 114768076) { throw "ZIP FFmpeg tests rejeté : taille $size o (attendu 114768076 o)" }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba") { throw "ZIP FFmpeg tests rejeté : SHA-256 $hash inattendu" }
          $dir = Join-Path $env:RUNNER_TEMP "ffmpeg-tests"
          if (Test-Path -LiteralPath $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $bin = Get-ChildItem -LiteralPath $dir -Directory | ForEach-Object { Join-Path $_.FullName "bin" } | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $bin) { throw "bin/ffmpeg.exe introuvable dans le ZIP FFmpeg tests" }
          $bin >> $env:GITHUB_PATH
          $env:PATH = "$bin;$env:PATH"
          ffmpeg.exe -version | Select-Object -First 2

      # Lockfile autoritaire : Cargo.lock Windows complet commité (278 packages,
      # root meeting-recorder-windows 0.1.11, deps Windows incluses), --locked
      # fail-closed : échoue au lieu de résoudre silencieusement. Le lock se met
      # à jour par PR relue, pas en CI.
      # Contrôle sur le lock commité.
      - name: Check
        run: cargo check --locked

      - name: Test
        run: cargo test --locked

      # Diagnostic ggml manquant : affiche les OUT_DIR et libs statiques réellement produits.
      - name: Diagnostic libs statiques
        if: always()
        run: |
          Write-Output "[ci] OUT_DIR whisper-rs-sys :"
          Get-ChildItem -Path "target/debug/build" -Directory -Filter "whisper-rs-sys-*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Output ("[ci] out: " + $_.FullName) }
          Write-Output "[ci] libs statiques sous target/ :"
          Get-ChildItem -Path "target" -Include *.a,*.lib -Recurse -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { Write-Output ("[ci] lib: " + $_.FullName + " (" + $_.Length + " o)") }

      - name: Build release (Vulkan OFF by default)
        run: cargo build --release --locked

      # Allowlist ORT vers target/release : onnxruntime.dll + providers
      # uniquement (jamais de *.dll aveugle). Remplace aussi les symlinks
      # copy-dylibs par de vrais fichiers (symlink-safe).
      - name: Copie DLL ORT vers target/release
        run: |
          foreach ($pat in @("onnxruntime.dll", "onnxruntime_providers_*.dll")) {
            Get-ChildItem (Join-Path $env:ORT_LIB_LOCATION $pat) -ErrorAction SilentlyContinue | ForEach-Object {
              $dest = Join-Path "target/release/" $_.Name
              if (Test-Path $dest) { Remove-Item $dest -Force }
              Copy-Item $_.FullName $dest -Force
            }
          }
          Write-Output "[ci] DLL ORT copiées vers target/release"

      # WiX v3 (candle/light/heat) pour le MSI per-user. Idempotent : choco
      # seulement si candle est absent.
      - name: Install WiX v3 (MSI)
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          }
          $wixBin = $null
          foreach ($dir in @("C:\Program Files (x86)\WiX Toolset v3.14\bin", "C:\Program Files (x86)\WiX Toolset v3.11\bin")) {
            if (Test-Path -LiteralPath $dir) { $wixBin = $dir; break }
          }
          if (-not $wixBin) { throw "candle.exe introuvable après choco install wixtoolset" }
          $wixBin >> $env:GITHUB_PATH
          $env:PATH = "$wixBin;$env:PATH"
          candle.exe -? | Select-Object -First 2

      # MSI per-user : stage runtime (collect-runtime.ps1, qui couvre aussi les
      # DLLs MinGW via target/release puis UCRT_BIN) puis heat/candle/light.
      # Version = input `tag` du dispatch, sinon tag déclencheur, sans le v
      # initial. Les steps précédents garantissent un tag existant avec
      # Cargo.toml à la même version ; tout autre cas échoue avant d'arriver ici.
      - name: Build MSI
        env:
          INPUT_TAG: ${{ inputs.tag }}
          # CI strict : le collector ignore toute copie locale (PATH/TargetRelease)
          # et embarque uniquement le ZIP FFmpeg pinné vérifié.
          MR_FFMPEG_PINNED_ONLY: "1"
        run: |
          $ref = $env:GITHUB_REF_NAME
          if ($env:INPUT_TAG) { $ref = $env:INPUT_TAG }
          if ($ref -notmatch '^v?(\d+(?:\.\d+)*)$') { throw "ref $ref n'est pas un tag version : MSI refusé" }
          $parts = @($Matches[1] -split '\.')
          while ($parts.Count -lt 3) { $parts += "0" }
          $version = ($parts[0..2] -join ".")
          Write-Output "[ci] msi version=$version (ref=$ref)"
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/collect-runtime.ps1
          if ($LASTEXITCODE -ne 0) { throw "collect-runtime.ps1 exit $LASTEXITCODE (stage partiel refusé)" }
          Set-Location packaging/windows
          heat dir stage -cg HarvestedFiles -gg -scom -sreg -sfrag -srd -dr INSTALLFOLDER -var var.StageDir -t harvest.xsl -out stage-files.wxs
          candle "-dStageDir=stage" "-dVersion=$version" Product.wxs stage-files.wxs
          # ICE09/ICE32/ICE61 exigent VBScript, absent des Windows récents (runners locaux) : même motif que les suppressions existantes.
          light -ext WixUIExtension -sice:ICE09 -sice:ICE32 -sice:ICE38 -sice:ICE43 -sice:ICE61 -sice:ICE64 -o "MeetingRecorder-$version.msi" Product.wixobj stage-files.wixobj
          Get-ChildItem *.msi | ForEach-Object { Write-Output ("[ci] msi: " + $_.FullName + " (" + $_.Length + " o)") }

      # Le MSI publié est exactement celui testé ici : installation
      # silencieuse per-user, lancement de l'exe installé avec --help SANS
      # ucrt64/bin au PATH (la closure embarquée doit suffire), ffmpeg
      # embarqué fonctionnel, puis désinstallation. Mêmes contrôles que
      # windows.yml : un MSI incomplet ne doit jamais atteindre la release.
      - name: Test MSI per-user (celui qui sera publié)
        run: |
          $msi = Get-ChildItem packaging/windows/*.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI introuvable sous packaging/windows/" }
          $log = Join-Path $env:RUNNER_TEMP "msi-install.log"
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart /L*v `"$log`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Get-Content $log -Tail 40 -ErrorAction SilentlyContinue
            throw "msiexec /i exit $($install.ExitCode)"
          }
          # Localisation robuste (runner SYSTEM) : le journal msiexec dit ou
          # l'install per-user a atterri (INSTALLFOLDER) ; repli : ratissage
          # LOCALAPPDATA + C:\Users\* + profil SYSTEM. Fail-closed si zero ou
          # plusieurs candidats ; en echec, le journal est affiche (diagnostic).
          Write-Output "[ci] whoami=$(whoami) LOCALAPPDATA=$env:LOCALAPPDATA"
          $exe = $null
          $logFolder = @(Select-String -Path $log -Pattern 'INSTALLFOLDER.*?([A-Z]:\\[^\"]+)' -ErrorAction SilentlyContinue | ForEach-Object { $_.Matches[0].Groups[1].Value.Trim().Trim([char]39, [char]34).TrimEnd([char]46, [char]32, [char]39, [char]34) } | Where-Object { $_ } | Select-Object -Last 1)
          if ($logFolder -and (Test-Path -LiteralPath (Join-Path $logFolder "meeting-recorder-windows.exe"))) { $exe = Join-Path $logFolder "meeting-recorder-windows.exe"; Write-Output "[ci] exe installe (journal msiexec)=$exe" }
          if (-not $exe) {
            $exeSearch = @((Join-Path $env:LOCALAPPDATA "Programs\MeetingRecorder\meeting-recorder-windows.exe"), (Join-Path (Join-Path $env:SystemRoot "System32\config\systemprofile\AppData\Local") "Programs\MeetingRecorder\meeting-recorder-windows.exe"))
            $exeSearch += @(Get-ChildItem -Path "C:\Users\*\AppData\Local\Programs\MeetingRecorder\meeting-recorder-windows.exe" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
            $exeHits = @($exeSearch | Where-Object { $_ } | Sort-Object -Unique | Where-Object { Test-Path -LiteralPath $_ })
            if ($exeHits.Count -gt 1) { throw "plusieurs exe installes candidats : $($exeHits -join ', ') (refus ambigu)" }
            if ($exeHits.Count -eq 0) {
              Get-Content $log -Tail 30 -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "[msi] $_" }
              Select-String -Path $log -Pattern "INSTALLFOLDER|MeetingRecorder" -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object { Write-Output "[msi] $($_.LineNumber): $($_.Line)" }
              throw "exe installe introuvable (journal + `$env:LOCALAPPDATA, C:\Users\*, profil SYSTEM)"
            }
            $exe = $exeHits[0]
            Write-Output "[ci] exe installe (ratissage profils)=$exe"
          }
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and $_ -notmatch 'msys|ucrt64|mingw|UCRT_BIN' }) -join ';'
          $helpProc = Start-Process $exe -ArgumentList "--help" -Wait -NoNewWindow -RedirectStandardOutput out.txt -PassThru
          if ($helpProc.ExitCode -ne 0) { throw "exe --help exit $($helpProc.ExitCode) (closure DLL incomplète ?)" }
          if (-not (Select-String -Path out.txt -Pattern "Usage" -Quiet)) { Get-Content out.txt -ErrorAction SilentlyContinue; throw "exe --help sans 'Usage' dans out.txt" }
          Write-Output "[ci] MSI per-user OK, exe --help OK sans UCRT au PATH"
          $ffExe = Join-Path (Split-Path $exe -Parent) "ffmpeg.exe"
          if (-not (Test-Path -LiteralPath $ffExe)) { throw "ffmpeg.exe embarqué introuvable : $ffExe" }
          $ffOut = & $ffExe -version 2>&1 | Select-Object -First 3
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg.exe embarqué -version exit $LASTEXITCODE" }
          if (-not $ffOut) { throw "ffmpeg.exe embarqué -version sans sortie (binaire corrompu ?)" }
          $ffOut | ForEach-Object { Write-Output "[ci] bundled ffmpeg: $_" }
          $uninstall = Start-Process msiexec.exe -ArgumentList "/x `"$($msi.FullName)`" /qn /norestart" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "msiexec /x exit $($uninstall.ExitCode)" }

      - name: Upload MSI Windows x86_64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msi
          if-no-files-found: error
          # Intermediaire : le job `release` publie le MSI en Release GitHub.
          retention-days: 3
          path: packaging/windows/*.msi

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download MSI Windows x86_64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-msi
          path: dist

      # Le MSI embarque tout (exe + ORT + MinGW + closure GTK + ffmpeg) et
      # remplace les anciens assets loose (exe + DLLs + script d'install).
      # L'artefact publié est le MSI du job build, téléchargé tel quel
      # (celui qui vient d'être testé : install + exe + ffmpeg + uninstall),
      # jamais reconstruit : le MSI publié est exactement celui qui a été testé.
      - name: Publie la release GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/**/*.msi
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
