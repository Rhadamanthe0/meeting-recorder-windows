name: release

# Release Windows déclenchée par tag v* (ex. v0.1.0). Build identique à
# windows.yml (toolchain GNU + MSYS2 UCRT64), puis publication GitHub.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Binaire portable, pas de -march=native du runner (crash AVX512 sur CPU cibles).
      GGML_NATIVE: "OFF"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # Même stratégie GTK que windows.yml : hôte GNU aligné sur MinGW UCRT64.
      - name: Install Rust stable GNU
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
          # Éteint le warning rustfmt non fatal vu en log CI.
          components: rustfmt

      - name: Affiche la toolchain (hôte GNU attendu)
        run: rustc -vV

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install GTK4 (MSYS2 UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang

      # ffmpeg bloquant : requis par export_audio, le step échoue si introuvable.
      - name: Install ffmpeg
        run: |
          winget install --exact --accept-source-agreements --accept-package-agreements Gyan.FFmpeg
          $ff = $null
          try { $ff = (Get-Command ffmpeg.exe -ErrorAction Stop).Source } catch {}
          if (-not $ff) {
            $pkg = Join-Path $env:LOCALAPPDATA "Microsoft\WinGet\Packages"
            if (Test-Path $pkg) { $ff = Get-ChildItem -Path $pkg -Filter "ffmpeg.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 | ForEach-Object { $_.FullName } }
          }
          if (-not $ff -or -not (Test-Path $ff)) { throw "ffmpeg.exe introuvable après winget install Gyan.FFmpeg" }
          Split-Path $ff -Parent >> $env:GITHUB_PATH
          & $ff -version | Select-Object -First 2
          Write-Output "[ci] ffmpeg=$ff"

      - name: Expose GTK au build GNU
        run: |
          # Diagnostic discriminant : affiche les faits (emplacement MSYS2 reel) au lieu de deviner.
          Write-Output "[ci] RUNNER_TEMP=$env:RUNNER_TEMP"
          Get-ChildItem $env:RUNNER_TEMP -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "[ci] tempdir: $($_.FullName)" }
          $roots = @((Join-Path $env:RUNNER_TEMP "setup-msys2"), "D:\msys64", "C:\msys64")
          $p = $null
          try { $p = (Get-Command pkgconf.exe -ErrorAction Stop).Source } catch {}
          foreach ($r in $roots) {
            Write-Output "[ci] test racine : $r -> $(Test-Path $r)"
            foreach ($sub in @("ucrt64\bin\pkgconf.exe", "msys64\ucrt64\bin\pkgconf.exe", "usr\bin\pkgconf.exe")) {
              $cand = if ($r) { Join-Path $r $sub } else { $null }
              if (-not $p -and $cand -and (Test-Path $cand)) { $p = $cand }
            }
            if (Test-Path $r) { Get-ChildItem $r -Directory -ErrorAction SilentlyContinue | Select-Object -First 12 | ForEach-Object { Write-Output "[ci] subdir de $r : $($_.Name)" } }
          }
          if (-not $p) {
            Write-Output "[ci] recherche pkgconf.exe sous RUNNER_TEMP (peut prendre 1-2 min)"
            Get-ChildItem -Path $env:RUNNER_TEMP -Filter "pkgconf.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 5 | ForEach-Object { Write-Output "[ci] trouve : $($_.FullName)"; if (-not $p) { $p = $_.FullName } }
          }
          if (-not $p) { throw "pkgconf.exe introuvable meme apres diagnostic (voir [ci] ci-dessus)" }
          $bindir = Split-Path $p -Parent
          $ucrt = Split-Path $bindir -Parent
          $bindir >> $env:GITHUB_PATH
          "PKG_CONFIG=$p" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$ucrt\lib\pkgconfig;$ucrt\share\pkgconfig" >> $env:GITHUB_ENV
          # bindgen (whisper-rs) exige libclang.dll via LIBCLANG_PATH (ucrt64/bin).
          "LIBCLANG_PATH=$bindir" >> $env:GITHUB_ENV
          "UCRT_BIN=$bindir" >> $env:GITHUB_ENV
          try { Copy-Item -LiteralPath $p -Destination (Join-Path $bindir "pkg-config.exe") } catch { Write-Warning "[ci] copie pkg-config.exe impossible, on continue : $($_.Exception.Message)" }
          Write-Output "[ci] pkgconf=$p"

      # ORT dynamique : binaires Microsoft 1.28 pour ort-sys GNU (sans précompilés GNU).
      - name: ORT dynamique Microsoft 1.28
        run: |
          $ortZip = Join-Path $env:RUNNER_TEMP "ort.zip"
          $ortDir = Join-Path $env:RUNNER_TEMP "ort"
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/onnxruntime-win-x64-1.28.0.zip" -OutFile $ortZip
          Expand-Archive -LiteralPath $ortZip -DestinationPath $ortDir -Force
          $ortRoot = Join-Path $ortDir "onnxruntime-win-x64-1.28.0"
          $ortLib = Join-Path $ortRoot "lib"
          if (-not (Test-Path $ortLib)) { $ortLib = $ortRoot }
          "ORT_LIB_LOCATION=$ortLib" >> $env:GITHUB_ENV
          "ORT_PREFER_DYNAMIC_LINK=1" >> $env:GITHUB_ENV
          $ortLib >> $env:GITHUB_PATH
          Write-Output "[ci] ORT_LIB_LOCATION=$ortLib"
          Get-ChildItem $ortLib | ForEach-Object { Write-Output "[ci] ort: $($_.Name)" }

      # Régénère le lock en CI : le Cargo.lock amont (Linux) ne contient pas
      # les deps Windows, cargo doit pouvoir le mettre à jour (accès réseau).
      - name: Generate lockfile
        run: cargo generate-lockfile

      # Contrôle sur le lock régénéré ci-dessus.
      - name: Check
        run: cargo check

      - name: Test
        run: cargo test

      # Diagnostic ggml manquant : affiche les OUT_DIR et libs statiques réellement produits.
      - name: Diagnostic libs statiques
        if: always()
        run: |
          Write-Output "[ci] OUT_DIR whisper-rs-sys :"
          Get-ChildItem -Path "target/debug/build" -Directory -Filter "whisper-rs-sys-*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Output ("[ci] out: " + $_.FullName) }
          Write-Output "[ci] libs statiques sous target/ :"
          Get-ChildItem -Path "target" -Include *.a,*.lib -Recurse -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { Write-Output ("[ci] lib: " + $_.FullName + " (" + $_.Length + " o)") }

      - name: Build release (Vulkan OFF by default)
        run: cargo build --release

      # Remplace les symlinks copy-dylibs par de vrais fichiers DLL (symlink-safe).
      - name: Copie DLL ORT vers target/release
        run: |
          Get-ChildItem (Join-Path $env:ORT_LIB_LOCATION "*.dll") | ForEach-Object {
            $dest = Join-Path "target/release/" $_.Name
            if (Test-Path $dest) { Remove-Item $dest -Force }
            Copy-Item $_.FullName $dest -Force
          }
          Write-Output "[ci] DLL ORT copiées vers target/release"

      # Lock régénéré à récupérer pour le committer ensuite.
      - name: Upload Cargo.lock régénéré
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          if-no-files-found: warn
          path: Cargo.lock

      # WiX v3 (candle/light/heat) pour le MSI per-user. Idempotent : choco
      # seulement si candle est absent.
      - name: Install WiX v3 (MSI)
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          }
          $wixBin = $null
          foreach ($dir in @("C:\Program Files (x86)\WiX Toolset v3.14\bin", "C:\Program Files (x86)\WiX Toolset v3.11\bin")) {
            if (Test-Path -LiteralPath $dir) { $wixBin = $dir; break }
          }
          if (-not $wixBin) { throw "candle.exe introuvable après choco install wixtoolset" }
          $wixBin >> $env:GITHUB_PATH
          $env:PATH = "$wixBin;$env:PATH"
          candle.exe -? | Select-Object -First 2

      # MSI per-user : stage runtime (collect-runtime.ps1, qui couvre aussi les
      # DLLs MinGW via target/release puis UCRT_BIN) puis heat/candle/light.
      # Version = tag déclencheur sans le v initial, sinon 0.1.0.
      - name: Build MSI
        run: |
          $version = "0.1.0"
          $ref = $env:GITHUB_REF_NAME
          if ($ref -match '^v?(\d+(?:\.\d+)*)$') {
            $parts = @($Matches[1] -split '\.')
            while ($parts.Count -lt 3) { $parts += "0" }
            $version = ($parts[0..2] -join ".")
          }
          Write-Output "[ci] msi version=$version (ref=$ref)"
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/collect-runtime.ps1
          if ($LASTEXITCODE -ne 0) { throw "collect-runtime.ps1 exit $LASTEXITCODE (stage partiel refusé)" }
          Set-Location packaging/windows
          heat dir stage -cg HarvestedFiles -gg -scom -sreg -sfrag -srd -dr INSTALLFOLDER -var var.StageDir -t harvest.xsl -out stage-files.wxs
          candle "-dStageDir=stage" "-dVersion=$version" Product.wxs stage-files.wxs
          light -ext WixUIExtension -sice:ICE38 -sice:ICE43 -sice:ICE64 -o "MeetingRecorder-$version.msi" Product.wixobj stage-files.wixobj
          Get-ChildItem *.msi | ForEach-Object { Write-Output ("[ci] msi: " + $_.FullName + " (" + $_.Length + " o)") }

      - name: Upload MSI Windows x86_64
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          if-no-files-found: error
          path: packaging/windows/*.msi

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download MSI Windows x86_64
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: dist

      # Le MSI embarque tout (exe + ORT + MinGW + closure GTK + ffmpeg) et
      # remplace les anciens assets loose (exe + DLLs + script d'install).
      - name: Publie la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.msi
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
