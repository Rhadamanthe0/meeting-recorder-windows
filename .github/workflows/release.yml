name: release

# Release Windows déclenchée par tag v* (ex. v0.1.0). Build identique à
# windows.yml (toolchain GNU + MSYS2 UCRT64), puis publication GitHub.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # Même stratégie GTK que windows.yml : hôte GNU aligné sur MinGW UCRT64.
      - name: Install Rust stable GNU
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu

      - name: Affiche la toolchain (hôte GNU attendu)
        run: rustc -vV

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install GTK4 (MSYS2 UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc

      # ffmpeg recommandé : non bloquant.
      - name: Install ffmpeg
        run: |
          try {
            winget install --exact --silent --accept-source-agreements --accept-package-agreements Gyan.FFmpeg
          } catch {
            Write-Warning "[ci] install ffmpeg impossible, on continue sans (non bloquant) : $($_.Exception.Message)"
          }
          exit 0

      - name: Expose GTK au build GNU
        run: |
          # Diagnostic discriminant : affiche les faits (emplacement MSYS2 reel) au lieu de deviner.
          Write-Output "[ci] RUNNER_TEMP=$env:RUNNER_TEMP"
          Get-ChildItem $env:RUNNER_TEMP -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "[ci] tempdir: $($_.FullName)" }
          $roots = @((Join-Path $env:RUNNER_TEMP "setup-msys2"), "D:\msys64", "C:\msys64")
          $p = $null
          try { $p = (Get-Command pkgconf.exe -ErrorAction Stop).Source } catch {}
          foreach ($r in $roots) {
            Write-Output "[ci] test racine : $r -> $(Test-Path $r)"
            foreach ($sub in @("ucrt64\bin\pkgconf.exe", "msys64\ucrt64\bin\pkgconf.exe", "usr\bin\pkgconf.exe")) {
              $cand = if ($r) { Join-Path $r $sub } else { $null }
              if (-not $p -and $cand -and (Test-Path $cand)) { $p = $cand }
            }
            if (Test-Path $r) { Get-ChildItem $r -Directory -ErrorAction SilentlyContinue | Select-Object -First 12 | ForEach-Object { Write-Output "[ci] subdir de $r : $($_.Name)" } }
          }
          if (-not $p) {
            Write-Output "[ci] recherche pkgconf.exe sous RUNNER_TEMP (peut prendre 1-2 min)"
            Get-ChildItem -Path $env:RUNNER_TEMP -Filter "pkgconf.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 5 | ForEach-Object { Write-Output "[ci] trouve : $($_.FullName)"; if (-not $p) { $p = $_.FullName } }
          }
          if (-not $p) { throw "pkgconf.exe introuvable meme apres diagnostic (voir [ci] ci-dessus)" }
          $bindir = Split-Path $p -Parent
          $ucrt = Split-Path $bindir -Parent
          $bindir >> $env:GITHUB_PATH
          "PKG_CONFIG=$p" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$ucrt\lib\pkgconfig;$ucrt\share\pkgconfig" >> $env:GITHUB_ENV
          try { Copy-Item -LiteralPath $p -Destination (Join-Path $bindir "pkg-config.exe") } catch { Write-Warning "[ci] copie pkg-config.exe impossible, on continue : $($_.Exception.Message)" }
          Write-Output "[ci] pkgconf=$p"

      # Régénère le lock en CI : le Cargo.lock amont (Linux) ne contient pas
      # les deps Windows, cargo doit pouvoir le mettre à jour (accès réseau).
      - name: Generate lockfile
        run: cargo generate-lockfile

      # Contrôle sur le lock régénéré ci-dessus.
      - name: Check
        run: cargo check

      - name: Test
        run: cargo test

      - name: Build release (Vulkan OFF by default)
        run: cargo build --release

      # Lock régénéré à récupérer pour le committer ensuite.
      - name: Upload Cargo.lock régénéré
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          if-no-files-found: warn
          path: Cargo.lock

      - name: Upload artefact Windows x86_64
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          if-no-files-found: error
          path: |
            target/release/meeting-recorder-windows.exe
            README.md
            install.ps1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artefact Windows x86_64
        uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: dist

      # Version = tag déclencheur (github.ref_name). Notes auto, release finale.
      - name: Publie la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/meeting-recorder-windows.exe
            dist/**/README.md
            dist/**/install.ps1
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
