name: wix-refresh-validation
on:
  push:
    branches: [chatgpt/fix-wix-preinstalled-hashes-20261018]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Analyse syntaxique des scripts PowerShell
        shell: pwsh
        run: |
          foreach ($path in @('.github/scripts/setup-wix.ps1', '.github/scripts/verify-wix-preinstalled.ps1', '.github/scripts/test-wix-preinstalled.ps1')) {
            $errors = $null
            $tokens = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "$path : $($errors | Out-String)" }
          }
          Write-Output 'PASS: PowerShell syntaxe'
      - name: Tests hors réseau des digests et de la réparation du cache
        shell: pwsh
        run: ./.github/scripts/test-wix-preinstalled.ps1
      - name: Métadonnées GitHub officielles réelles
        shell: pwsh
        run: |
          . ./.github/scripts/verify-wix-preinstalled.ps1
          $hash = Get-CIWiXTrustedArchiveSha256
          if ($hash -cne '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31') {
            throw 'WiX metadata unexpected'
          }
          Write-Output 'PASS: digest officiel ou repli vers hash épinglé'
      - name: Validation YAML GitHub Actions (actionlint épinglé)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 60 --silent --show-error \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz' \
            -o /tmp/actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check --strict
          tar xf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/windows.yml .github/workflows/release.yml .github/workflows/wix-refresh-validation.yml
