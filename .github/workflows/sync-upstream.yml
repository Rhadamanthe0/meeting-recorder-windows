name: sync-upstream

# Veille de l'amont Linux (jankeesvw/omarchy-meeting-recorder). Le portage
# Windows a ete copie de l'amont v1.4.0 sans son historique git : un merge
# automatique est impossible ("unrelated histories"), et la plupart des
# changements amont (barre Waybar, AUR, archives Linux) n'ont pas de sens
# ici. Ce workflow ne touche donc pas au code : a chaque nouvelle version
# amont, il ouvre une issue qui liste ses changements, a trier et porter a
# la main. La derniere version amont examinee est dans .github/upstream-version.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ouvrir une issue pour chaque nouvelle version amont
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM: jankeesvw/omarchy-meeting-recorder
        run: |
          set -euo pipefail
          SEEN="$(tr -d '[:space:]' < .github/upstream-version)"
          LATEST="$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)"
          # Noms de tags venus de l'API : refuses s'ils ne sont pas des versions.
          for tag in "$SEEN" "$LATEST"; do
            [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)*$ ]] || { echo "Tag inattendu : $tag"; exit 1; }
          done
          if [ "$SEEN" = "$LATEST" ]; then
            echo "Amont toujours en $LATEST, rien a faire."
            exit 0
          fi
          TITLE="Amont $LATEST : changements a trier pour le portage Windows"
          if [ "$(gh issue list --state open --search "in:title \"Amont $LATEST\"" --json number --jq 'length')" != 0 ]; then
            echo "Issue deja ouverte pour $LATEST."
            exit 0
          fi
          COMMITS="$(gh api "repos/$UPSTREAM/compare/$SEEN...$LATEST" --jq '.commits[] | "- " + (.commit.message | split("\n")[0])')"
          FILES="$(gh api "repos/$UPSTREAM/compare/$SEEN...$LATEST" --jq '.files[].filename' | sed 's/^/- /')"
          printf '%s\n' \
            "L'amont est passe de $SEEN a $LATEST." \
            "" \
            "Comparaison : https://github.com/$UPSTREAM/compare/$SEEN...$LATEST" \
            "" \
            "## Commits" "$COMMITS" "" \
            "## Fichiers" "$FILES" "" \
            "Porter ce qui sert sous Windows (le reste : barre Waybar, AUR, archives Linux), puis mettre $LATEST dans .github/upstream-version." \
            > body.md
          gh issue create --title "$TITLE" --body-file body.md
